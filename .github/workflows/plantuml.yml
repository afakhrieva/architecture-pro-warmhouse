name: PlantUML Diagrams

on:
  push:
    branches:
      - warmhouse
  pull_request:
    branches:
      - main

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install PlantUML
        run: sudo apt-get install plantuml

      - name: Download PlantUML with C4 plugin
        run: |
          # Скачиваем PlantUML с C4 плагином
          wget https://github.com/plantuml/plantuml/releases/download/v1.2024.0/plantuml-1.2024.0.jar -O plantuml.jar

          # Создаем директорию для includes если её нет
          mkdir -p includes/C4

      - name: Download C4 includes
        run: |
          # Скачиваем C4-файлы напрямую
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4_Context.puml -O includes/C4/C4_Context.puml
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4_Container.puml -O includes/C4/C4_Container.puml
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4_Component.puml -O includes/C4/C4_Component.puml
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4.puml -O includes/C4/C4.puml

      - name: Generate Diagrams
        run: |
          # Указываем PlantUML где искать includes
          for file in diagrams/context/*.puml diagrams/container/*.puml diagrams/component/*.puml diagrams/code/*.puml; do
            if [ -f "$file" ]; then
              echo "Processing $file"
              java -jar plantuml.jar -charset UTF-8 -Iincludes/ "$file"
            fi
          done

      - name: Commit Diagrams
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add diagrams/**/*.png
          git commit -m "Automated diagram generation"
          git push origin warmhouse
        if: success()