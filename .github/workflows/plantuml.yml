name: PlantUML Diagrams

on:
  push:
    branches:
      - warmhouse
  pull_request:
    branches:
      - main

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install PlantUML
        run: sudo apt-get install plantuml

      - name: Download PlantUML with C4 plugin
        run: |
          # Скачиваем PlantUML с C4 плагином
          wget https://github.com/plantuml/plantuml/releases/download/v1.2024.0/plantuml-1.2024.0.jar -O plantuml.jar

      - name: Setup C4 includes
        run: |
          mkdir -p ~/.plantuml
          cd ~/.plantuml
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4_Context.puml
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4_Container.puml
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4_Component.puml
          wget https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4.puml
          
          # Устанавливаем переменную окружения для поиска includes
          echo "PLANTUML_LIBS=~/.plantuml" >> $GITHUB_ENV

      - name: Generate Diagrams
        run: |
          java -jar plantuml.jar -charset UTF-8 diagrams/context/*.puml
          java -jar plantuml.jar -charset UTF-8 diagrams/container/*.puml
          java -jar plantuml.jar -charset UTF-8 diagrams/component/*.puml
          java -jar plantuml.jar -charset UTF-8 diagrams/code/*.puml

      - name: Commit Diagrams
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add diagrams/**/*.png
          git commit -m "Automated diagram generation"
          git push origin warmhouse
        if: success()