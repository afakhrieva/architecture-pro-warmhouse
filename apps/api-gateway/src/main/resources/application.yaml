spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # User Service
        - id: user-service
          uri: http://user-service:8001
          predicates:
            - Path=/api/users/**
          filters:
            - AddRequestHeader=X-Service-Name, user-service
          order: 1

        # Device Service
        - id: device-service
          uri: http://device-service:8002
          predicates:
            - Path=/api/devices/**
          filters:
            - AddRequestHeader=X-Service-Name, device-service
          order: 2

        # Telemetry Service
        - id: telemetry-service
          uri: http://telemetry-service:8003
          predicates:
            - Path=/api/telemetry/**
          filters:
            - AddRequestHeader=X-Service-Name, telemetry-service
          order: 3

        # === МОНОЛИТ (временный маршрут) ===
        - id: monolith
          uri: http://monolith:8080
          predicates:
            - Path=/api/v1/sensors/**
          filters:
            - AddRequestHeader=X-Source, gateway
          order: 4

        # === HEALTH CHECK ===
        - id: health
          uri: http://device-service:8001
          predicates:
            - Path=/health
          filters:
            - SetPath=/actuator/health
          order: 5

  main:
    web-application-type: reactive

server:
  port: 8080

# Для просмотра роутов через Actuator
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true