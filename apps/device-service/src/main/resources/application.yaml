springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

server:
  port: 8002

spring:
  application:
    name: device-service

smart-home:
  base-url: http://smart-home:8080

logging:
  level:
    com.smarthome.deviceservice.client: DEBUG